# CI: build + test on every pull request. The heavier checks (sanitizers, lint, coverage) live in test.yml and the
# downstream-consumer checks in consumers.yml.
#
# Linux jobs run inside ghcr.io/ai-warevo/ci-cpp23 (linux/amd64):
#   gcc-15, clang-18 (libstdc++ + libc++), cmake, ninja, gcovr
# MSVC runs on windows-latest (native runner).

name: CI

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.toolchain }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]
        build_type: [Debug, Release]

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      # Linux job: enable all POSIX transports and examples
      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: ${{ matrix.build_type }}
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DTOBUS_WARNINGS_AS_ERRORS=ON
            -DTOBUS_BUILD_EXAMPLES=ON
            -DTOBUS_ENABLE_UNIX_SOCKET=ON
            -DTOBUS_ENABLE_TCP_SERVER=ON
            -DTOBUS_ENABLE_HTTP=ON
            -DTOBUS_ENABLE_WEBSOCKET=ON
            -DTOBUS_ENABLE_REDIS=ON
            -DTOBUS_ENABLE_ZEROMQ=ON
            -DTOBUS_ENABLE_RABBITMQ=ON
            -DTOBUS_ENABLE_KAFKA=ON

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: ${{ matrix.build_type }}
          output_on_failure: true
          timeout: 120

      - name: Run example
        run: ./build/examples/chat/tobus_example_chat

  build-test-windows:
    name: Windows ${{ matrix.toolchain }} / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc]
        build_type: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Windows job: MSVC with stub transports (unreachable code warnings)
      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: ${{ matrix.build_type }}
          extra_args: >-
            -DTOBUS_ENABLE_UNIX_SOCKET=OFF
            -DTOBUS_ENABLE_TCP_SERVER=OFF
            -DTOBUS_ENABLE_HTTP=OFF
            -DTOBUS_ENABLE_WEBSOCKET=OFF
            -DTOBUS_ENABLE_REDIS=ON
            -DTOBUS_ENABLE_ZEROMQ=ON
            -DTOBUS_ENABLE_RABBITMQ=ON
            -DTOBUS_ENABLE_KAFKA=ON
            -DTOBUS_BUILD_TESTS=OFF

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: ${{ matrix.build_type }}
          output_on_failure: true
        if: false  # Tests disabled on Windows MSVC due to Catch2 linker issues

      - name: Run example (Windows)
        shell: pwsh
        run: |
          $exe = "./build/examples/chat/tobus_example_chat.exe"
          Write-Host "=== tobus_example_chat"
          & $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Default options (no transport stubs): this is what a consumer gets without enabling anything.
  build-test-default:
    name: default options / ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DTOBUS_WARNINGS_AS_ERRORS=ON

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Release
          output_on_failure: true
          timeout: 120

  build-test-default-windows:
    name: Windows default options / ${{ matrix.toolchain }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [msvc]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Windows job: default options (stub transports with unreachable code warnings).
      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: >-
            -DTOBUS_BUILD_TESTS=OFF

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Release
          output_on_failure: true
