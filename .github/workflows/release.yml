# Release versioning, changelog promotion, checksums, and GitHub Release are
# provided by the shared reusable workflow. This project publishes no binaries.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (X.Y.Z); use auto to derive from CHANGELOG.md'
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Publish release
    uses: ai-warevo/.github/.github/workflows/reusable-release.yml@main
    with:
      version: ${{ inputs.version || 'auto' }}
    permissions:
      contents: write
      actions: write
