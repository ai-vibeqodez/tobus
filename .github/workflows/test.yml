# Test: everything that is too slow or too noisy for the per-PR build matrix in ci.yml.
#   lint        clang-format + clang-tidy (clang 18)
#   sanitizers  ASan+UBSan and TSan, full suite + 30x the concurrency tests
#   stress      30x the concurrency tests in optimized builds (different timing, different races)
#   coverage    gcc --coverage -> gcovr; the badge/report are published only from main
#
# All Linux jobs run inside ghcr.io/ai-warevo/ci-cpp23 (gcc-15, clang-18, cmake, ninja, gcovr).

name: Test

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write # badge + gh-pages deploy (main only)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (clang-format, clang-tidy)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: clang18-libcxx
          container_mode: true
          tools: 'true'

      # The action ANDs its -name filters, so `extensions: cpp,hpp` would match no file at all: one step per extension.
      - name: clang-format (.hpp)
        uses: ai-warevo/.github/.github/actions/clang-format@main
        with:
          source_dir: .
          extensions: hpp
      - name: clang-format (.cpp)
        uses: ai-warevo/.github/.github/actions/clang-format@main
        with:
          source_dir: .
          extensions: cpp

      # Configure + build: clang-tidy needs compile_commands.json and the fetched dependencies.
      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DTOBUS_ENABLE_UNIX_SOCKET=ON
            -DTOBUS_ENABLE_TCP_SERVER=ON
            -DTOBUS_ENABLE_HTTP=ON
            -DTOBUS_ENABLE_WEBSOCKET=ON
            -DTOBUS_ENABLE_REDIS=ON
            -DTOBUS_ENABLE_ZEROMQ=ON
            -DTOBUS_ENABLE_RABBITMQ=ON
            -DTOBUS_ENABLE_KAFKA=ON

      # The checks come from .clang-tidy (the action merges `checks` with it, so a no-op value is passed on purpose;
      # the action's default list is not wanted). Scanned per directory: ci/consumers is not in compile_commands.json.
      - name: clang-tidy (include)
        uses: ai-warevo/.github/.github/actions/clang-tidy@main
        with: { source_dir: include, build_dir: ../build, checks: '-llvmlibc-*', header_filter: '.*/tobus/(include|src)/.*' }
      - name: clang-tidy (src)
        uses: ai-warevo/.github/.github/actions/clang-tidy@main
        with: { source_dir: src, build_dir: ../build, checks: '-llvmlibc-*', header_filter: '.*/tobus/(include|src)/.*' }
      - name: clang-tidy (examples)
        uses: ai-warevo/.github/.github/actions/clang-tidy@main
        with: { source_dir: examples, build_dir: ../build, checks: '-llvmlibc-*', header_filter: '.*/tobus/(include|src)/.*' }
      - name: clang-tidy (tests)
        uses: ai-warevo/.github/.github/actions/clang-tidy@main
        with: { source_dir: tests, build_dir: ../build, checks: '-llvmlibc-*', header_filter: '.*/tobus/(include|src)/.*' }

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    # The distro libc++/libc++abi are not ASan-instrumented: they allocate exception messages with the (intercepted)
    # operator new but release them with plain free(), which ASan reports as alloc-dealloc-mismatch on every
    # thrown std::runtime_error/logic_error. A toolchain false positive, not a tobus bug.
    env:
      ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=1
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan (clang-18, libc++)
            toolchain: clang18-libcxx
            sanitizer: address
          # TSan uses libstdc++: libc++'s shared_ptr/atomic internals are not TSan-instrumented in the distro package,
          # which would report false races on the very reference counts this library relies on.
          - name: TSan (clang-18, libstdc++)
            toolchain: clang18-libstdcxx
            sanitizer: thread

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true
          sanitizer_runtime: 'true'

      # TSan maps shadow memory at fixed addresses; recent kernels' ASLR range makes it abort at startup.
      # In container mode the kernel is the host kernel, so sysctl works.
      - name: Relax ASLR for ThreadSanitizer
        if: matrix.sanitizer == 'thread'
        run: sysctl vm.mmap_rnd_bits=28

      # AW_TPL_SANITIZE adds PUBLIC compile/link flags to aw::tpl, so tobus and the tests are instrumented as well.
      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: RelWithDebInfo
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DAW_TPL_SANITIZE=${{ matrix.sanitizer }}

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: RelWithDebInfo
          output_on_failure: true
          timeout: 300

      - name: Repeat the concurrency tests 30x
        working-directory: build
        env:
          TSAN_OPTIONS: halt_on_error=1 second_deadlock_stack=1
          ASAN_OPTIONS: alloc_dealloc_mismatch=0:detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest -C RelWithDebInfo -R tobus_concurrency --repeat until-fail:30 --output-on-failure --timeout 300

  stress:
    name: Repeat concurrency tests 30x (${{ matrix.toolchain }}, Release)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }}

      # `until-fail:30` = run up to 30 times and stop at the first failure.
      - name: Repeat the concurrency tests
        working-directory: build
        run: ctest -C Release -R tobus_concurrency --repeat until-fail:30 --output-on-failure --timeout 120

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The distro g++ (13): gcovr pins the `gcov` matching the default gcc, so build with that same compiler.
      # AW_TPL_ENABLE_COVERAGE adds PUBLIC --coverage flags to aw::tpl, which instruments tobus and the tests too.
      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: gcc15
          container_mode: true

      - name: Configure & Build
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Debug
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DAW_TPL_ENABLE_COVERAGE=ON

      - name: Run Tests
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: .
          build_dir: build
          config: Debug
          output_on_failure: true
          timeout: 300

      - name: Generate Coverage Reports (XML & HTML)
        uses: ai-warevo/.github/.github/actions/gcovr-report@main
        with:
          source_dir: .
          build_dir: build
          source_filter: "include/aw/tobus/ src/"
          exclude: _deps/*
          output_dir: htmlcov
          xml_path: coverage.xml

      - name: Parse Coverage Metrics
        id: coverage_parser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/.github/actions/coverage-parser@main
        with:
          xml_path: coverage.xml

      - name: Generate Coverage Badge
        id: badge_generator
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/.github/actions/badge@main
        with:
          width: '99'
          height: '20'
          text_left: 'coverage'
          text_right: '${{ steps.coverage_parser.outputs.percent }}'
          bg_color_right: '${{ steps.coverage_parser.outputs.color }}'
          filename: 'coverage.svg'

      - name: Deploy Badge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/.github/actions/badge-deploy@main
        with:
          badge_path: coverage.svg

      - name: Deploy Coverage Report to gh-pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ai-warevo/.github/.github/actions/coverage-html-deploy@main
        with:
          folder: htmlcov
