# Consumers: does tobus work for a downstream project? Three consumption patterns are tested, each
# a minimal test project in ci/consumers/ that creates an event bus and verifies basic functionality.
#   add_subdirectory  tobus as a subdirectory/submodule of the parent project
#   find_package      tobus installed to a prefix (aw_tpl comes with it)
#   fetch_content     FetchContent_MakeAvailable straight from GitHub, pinned to the commit under test
#
# fetch_content clones from the network, so it only means something once the commit is pushed; it is pinned to the
# exact commit being tested (PR head / pushed sha) rather than `main`, so a PR tests itself.
#
# Linux jobs run inside ghcr.io/ai-warevo/ci-cpp23 (linux/amd64).
# MSVC runs on windows-latest (native runner).

name: Consumers

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # ADD_SUBDIRECTORY — Linux (container)
  # ────────────────────────────────────────────────────────────
  add-subdirectory-linux:
    name: add_subdirectory (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build consumer
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ci/consumers/add_subdirectory
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DTOBUS_SOURCE_DIR=.

      - name: Run consumer
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ci/consumers/add_subdirectory
          build_dir: build
          output_on_failure: true

  add-subdirectory-windows:
    name: add_subdirectory (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: msvc

      - name: Configure & Build consumer
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ci/consumers/add_subdirectory
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DTOBUS_SOURCE_DIR=.

      - name: Run consumer
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ci/consumers/add_subdirectory
          build_dir: build
          output_on_failure: true

  # ────────────────────────────────────────────────────────────
  # FIND_PACKAGE — Linux (container)
  # ────────────────────────────────────────────────────────────
  find-package-linux:
    name: find_package (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Build & install tobus (+ aw_tpl)
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          install: true
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DTOBUS_BUILD_TESTS=OFF
            -DTOBUS_BUILD_EXAMPLES=OFF
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix

      - name: Configure & Build consumer
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ci/consumers/find_package
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix

      - name: Run consumer
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ci/consumers/find_package
          build_dir: build
          output_on_failure: true

  find-package-windows:
    name: find_package (MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: msvc

      - name: Build & install tobus (+ aw_tpl)
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          install: true
          extra_args: >-
            ${{ steps.tc.outputs.cmake_args }}
            -DTOBUS_BUILD_TESTS=OFF
            -DTOBUS_BUILD_EXAMPLES=OFF
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix

      - name: Configure & Build consumer
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ci/consumers/find_package
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix

      - name: Run consumer
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ci/consumers/find_package
          build_dir: build
          output_on_failure: true

  # ────────────────────────────────────────────────────────────
  # FETCH_CONTENT — Linux (container)
  # ────────────────────────────────────────────────────────────
  fetch-content-linux:
    name: FetchContent (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ai-warevo/ci-cpp23
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]
    env:
      # PR: the head commit of the PR's own repository (works for forks too); otherwise the pushed commit.
      TOBUS_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      TOBUS_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout (only for the composite actions and the consumer project)
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: ${{ matrix.toolchain }}
          container_mode: true

      - name: Configure & Build consumer (fetches tobus ${{ env.TOBUS_TAG }})
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ci/consumers/fetch_content
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DTOBUS_GIT_URL=${{ env.TOBUS_URL }} -DTOBUS_GIT_TAG=${{ env.TOBUS_TAG }}

      - name: Run consumer
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ci/consumers/fetch_content
          build_dir: build
          output_on_failure: true

  fetch-content-windows:
    name: FetchContent (MSVC)
    runs-on: windows-latest
    env:
      TOBUS_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      TOBUS_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout (only for the composite actions and the consumer project)
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install toolchain
        id: tc
        uses: ai-warevo/.github/.github/actions/setup-toolchain@main
        with:
          toolchain: msvc

      - name: Configure & Build consumer (fetches tobus ${{ env.TOBUS_TAG }})
        uses: ai-warevo/.github/.github/actions/cmake-build@main
        with:
          source_dir: ci/consumers/fetch_content
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DTOBUS_GIT_URL=${{ env.TOBUS_URL }} -DTOBUS_GIT_TAG=${{ env.TOBUS_TAG }}

      - name: Run consumer
        uses: ai-warevo/.github/.github/actions/ctest-run@main
        with:
          source_dir: ci/consumers/fetch_content
          build_dir: build
          output_on_failure: true
