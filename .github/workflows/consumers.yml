# Consumers: does tobus work for a downstream project? Three ways of depending on it, each a tiny project in
# ci/consumers/ that publishes and receives one event.
#   add_subdirectory  tobus as a subdirectory/submodule of the parent project
#   find_package      tobus installed to a prefix (aw_tpl comes with it)
#   fetch_content     FetchContent_MakeAvailable straight from GitHub, pinned to the commit under test (how smlq_sfw uses it)
#
# fetch_content clones from the network, so it only means something once the commit is pushed; it is pinned to the
# exact commit being tested (PR head / pushed sha) rather than `main`, so a PR tests itself.

name: Consumers

on:
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  add-subdirectory:
    name: add_subdirectory (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ./.github/actions/setup-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Configure & Build consumer
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: ci/consumers/add_subdirectory
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DTOBUS_SOURCE_DIR=${{ github.workspace }}

      - name: Run consumer
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: ci/consumers/add_subdirectory
          build_dir: build
          output_on_failure: true

  find-package:
    name: find_package (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ./.github/actions/setup-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Build & install tobus (+ aw_tpl)
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: .
          build_dir: build
          build_type: Release
          install: true
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DTOBUS_BUILD_TESTS=OFF -DTOBUS_BUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/prefix

      - name: Configure & Build consumer
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: ci/consumers/find_package
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/prefix

      - name: Run consumer
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: ci/consumers/find_package
          build_dir: build
          output_on_failure: true

  fetch-content:
    name: FetchContent (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [clang18-libcxx, gcc15]
    env:
      # PR: the head commit of the PR's own repository (works for forks too); otherwise the pushed commit.
      TOBUS_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      TOBUS_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout (only for the composite actions and the consumer project)
        uses: actions/checkout@v4

      - name: Install toolchain
        id: tc
        uses: ./.github/actions/setup-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Configure & Build consumer (fetches tobus ${{ env.TOBUS_TAG }})
        uses: ai-warevo/.github/ci/actions/cmake-build@main
        with:
          source_dir: ci/consumers/fetch_content
          build_dir: build
          build_type: Release
          extra_args: ${{ steps.tc.outputs.cmake_args }} -DTOBUS_GIT_URL=${{ env.TOBUS_URL }} -DTOBUS_GIT_TAG=${{ env.TOBUS_TAG }}

      - name: Run consumer
        uses: ai-warevo/.github/ci/actions/ctest-run@main
        with:
          source_dir: ci/consumers/fetch_content
          build_dir: build
          output_on_failure: true
