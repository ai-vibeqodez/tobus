# setup-toolchain: installs one of the compilers tobus is tested with and reports the matching CMake arguments.
#
# Toolchains:
#   clang18-libcxx   clang-18 + libc++   (the primary configuration; needs -fexperimental-library, added by aw::tpl)
#   clang18-libstdcxx clang-18 + libstdc++ (used for TSan: libc++'s shared_ptr/atomics internals are not instrumented)
#   gcc15            g++-15 + libstdc++  (from the ubuntu-toolchain-r/test PPA; ubuntu-24.04 ships up to g++-14)
#   msvc             MSVC (Visual Studio 17+ on windows-latest)
#
# Usage:
#   - id: tc
#     uses: ai-warevo/.github/ci/actions/setup-toolchain@main
#     with: { toolchain: clang18-libcxx }
#   - uses: ai-warevo/.github/ci/actions/cmake-build@main
#     with: { extra_args: "${{ steps.tc.outputs.cmake_args }} -DTOBUS_WARNINGS_AS_ERRORS=ON" }

name: 'Setup toolchain'
description: 'Install clang-18 (libc++ or libstdc++) or g++-15 or MSVC and output the CMake arguments that select it'

inputs:
  toolchain:
    description: 'clang18-libcxx | clang18-libstdcxx | gcc15 | msvc'
    required: true
  sanitizer_runtime:
    description: 'Also install the clang sanitizer runtimes (libclang-rt-18-dev)'
    required: false
    default: 'false'
  tools:
    description: 'Also install clang-format-18 / clang-tidy-18 and make them the default clang-format / clang-tidy'
    required: false
    default: 'false'

outputs:
  cmake_args:
    description: 'Arguments for cmake-build extra_args (no spaces inside a single argument)'
    value: ${{ steps.args.outputs.cmake_args }}

runs:
  using: 'composite'
  steps:
    - name: Install packages
      if: inputs.toolchain != 'msvc'
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
        SANITIZER_RUNTIME: ${{ inputs.sanitizer_runtime }}
        TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        PKGS=(ninja-build)
        case "$TOOLCHAIN" in
          clang18-libcxx)
            PKGS+=(clang-18 libc++-18-dev libc++abi-18-dev) ;;
          clang18-libstdcxx)
            PKGS+=(clang-18) ;;
          gcc15)
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            PKGS+=(g++-15) ;;
          *)
            echo "::error::unknown toolchain '$TOOLCHAIN'"; exit 1 ;;
        esac
        if [ "$SANITIZER_RUNTIME" = "true" ]; then PKGS+=(libclang-rt-18-dev); fi
        if [ "$TOOLS" = "true" ]; then PKGS+=(clang-format-18 clang-tidy-18); fi
        sudo apt-get update || true
        sudo apt-get install -y --fix-missing --no-install-recommends "${PKGS[@]}" || sudo apt-get install -y --fix-missing --no-install-recommends "${PKGS[@]}"
        if [ "$TOOLS" = "true" ]; then
          # The CI actions call plain `clang-format` / `clang-tidy`: point them at version 18.
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v clang-format-18)" "$HOME/.local/bin/clang-format"
          ln -sf "$(command -v clang-tidy-18)" "$HOME/.local/bin/clang-tidy"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi

    - name: Setup MSVC environment
      if: inputs.toolchain == 'msvc'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compute CMake arguments
      id: args
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        set -euo pipefail
        case "$TOOLCHAIN" in
          clang18-libcxx)
            ARGS="-GNinja -DCMAKE_CXX_COMPILER=clang++-18 -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libc++" ;;
          clang18-libstdcxx)
            ARGS="-GNinja -DCMAKE_CXX_COMPILER=clang++-18" ;;
          gcc15)
            ARGS="-GNinja -DCMAKE_CXX_COMPILER=g++-15" ;;
          msvc)
            ARGS="-GNinja" ;;
        esac
        echo "cmake_args=$ARGS" >> "$GITHUB_OUTPUT"
